# EXAMPLE ONLY — illustrative configuration; not a live deployment setting.

phase:
  name: html
  version: 4
  information_boundary: html

extractors:
  - name: html-js
    version: 5
  - name: dom-fingerprint
    version: 2

classifiers:
  - name: html-js-classifier
    version: 9
    input_schema:
      name: html-js
      version: 5
  - name: dom-phishing-classifier
    version: 5
    input_schema:
      name: dom-fingerprint
      version: 2

execution:
  # Independent classifiers for a domain may run concurrently.
  parallel_classifiers: true
  # Maximum domains processed concurrently by ONE phase instance.
  # Larger batches wait for free execution slots; they are not rejected.
  max_concurrent_domains: 4

policy:
  type: rule_based
  outputs:
    - benign
    - phishing
    - malware
    - spam
    - uncertain
  otherwise: uncertain

transport:
  type: http
  http:
    host: 0.0.0.0
    port: 8080
