global
    log stdout format raw local0

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend http_in
    bind *:8080
    default_backend html_phase

backend html_phase
    balance roundrobin
    option httpchk GET /health
    server-template phase 5 html-phase:8080 check resolvers docker init-addr libc,none
