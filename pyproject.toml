[project]
name = "malicious-domain-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "numpy>=1.26",
  "pandas>=2",
  "scikit-learn>=1.5",
  "shap>=0.46",
  "wandb>=0.18",
]

[project.optional-dependencies]
tuning = ["optuna>=4"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
