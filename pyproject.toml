[project]
name = "malicious-domain-ml-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "jsonschema>=4.22",
  "numpy>=1.26",
  "pandas>=2",
  "scikit-learn>=1.5",
  "shap>=0.46",
  "wandb>=0.18",
]

[project.optional-dependencies]
tuning = ["optuna>=4"]
dev = ["pytest>=8", "httpx>=0.27"]
serving = ["fastapi>=0.115", "uvicorn>=0.30"]
kafka = ["aiokafka>=0.12"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
