type: object

properties:
  classifier:
    type: object
    properties:
      name:
        type: string
        minLength: 1
      version:
        type: integer
        minimum: 1
    required:
    - name
    - version
    additionalProperties: false

  implementation:
    type: object
    properties:
      framework:
        type: string
        minLength: 1
      source_module:
        type: string
        minLength: 1
    required:
    - framework
    - source_module
    additionalProperties: false

  input:
    type: array
    minItems: 1
    items:
      type: object
      properties:
        feature_schema:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
      required:
      - feature_schema
      - version
      additionalProperties: false

  output:
    type: object
    properties:
      type:
        enum:
        - binary
        - multiclass
        - multilabel
        - score
      classes:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 0
      score_name:
        type: string
        minLength: 1
      range:
        type: array
        prefixItems:
          - type: number
          - type: number
        minItems: 2
        maxItems: 2
      score_semantics:
        type: string
        minLength: 1
    required:
    - type
    additionalProperties: true

  explainability:
    type: object
    properties:
      local:
        type: object
        properties:
          method:
            type: string
            minLength: 1
          required:
            type: boolean
        required:
        - method
        additionalProperties: true
      global:
        type: object
        properties:
          methods:
            type: array
            items:
              type: string
              minLength: 1
            minItems: 0
        required: []
        additionalProperties: true
    required: []
    additionalProperties: true

  training:
    type: array
    items:
      type: object
      properties:
        outlier_policy:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
      required: []
      additionalProperties: true

required:
- classifier
- implementation
- input
- output

additionalProperties: false
$schema: https://json-schema.org/draft/2020-12/schema
x-config-root-key: classifier
