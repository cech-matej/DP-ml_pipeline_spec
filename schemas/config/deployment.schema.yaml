type: object

properties:
  deployment:
    type: object
    properties:
      name:
        type: string
        minLength: 1
      phase:
        type: string
        minLength: 1
      transport:
        enum:
        - http
        - kafka
      replicas:
        type: integer
        minimum: 1
      load_balancer:
        type: string
        minLength: 1
      resources:
        type: object
        properties:
          cpu:
            type: string
            minLength: 1
          memory:
            type: string
            minLength: 1
        required: []
        additionalProperties: true
      kafka:
        type: object
        properties:
          group_id:
            type: string
            minLength: 1
          required_input_partitions:
            type: integer
            minimum: 1
        required: []
        additionalProperties: true
    required:
    - name
    - phase
    - transport
    - replicas
    additionalProperties: true

required:
- deployment

additionalProperties: false
$schema: https://json-schema.org/draft/2020-12/schema
x-config-root-key: deployment
