type: object

properties:
  phase:
    type: object
    properties:
      name:
        type: string
        minLength: 1
      version:
        type: integer
        minimum: 1
      information_boundary:
        type: string
        minLength: 1
    required:
    - name
    - version
    - information_boundary
    additionalProperties: false

  extractors:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
      required:
      - name
      - version
      additionalProperties: false
    minItems: 1

  classifiers:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        input_schema:
          type: object
          properties:
            name:
              type: string
              minLength: 1
            version:
              type: integer
              minimum: 1
          required:
          - name
          - version
          additionalProperties: false
      required:
      - name
      - version
      - input_schema
      additionalProperties: false
    minItems: 1

  execution:
    type: object
    properties:
      parallel_classifiers:
        type: boolean
      max_concurrent_domains:
        type: integer
        minimum: 1
    required:
    - parallel_classifiers
    - max_concurrent_domains
    additionalProperties: false

  policy:
    type: object

  transport:
    type: object
    properties:
      type:
        type: string
        enum:
        - http
        - kafka
      http:
        type: object
        properties:
          host:
            type: string
            minLength: 1
          port:
            type: integer
            minimum: 1
            maximum: 65535
        required:
        - host
        - port
        additionalProperties: false
      kafka:
        type: object
        properties:
          bootstrap_servers:
            type: string
            minLength: 1
          input_topic:
            type: string
            minLength: 1
          output_topic:
            type: string
            minLength: 1
          group_id:
            type: string
            minLength: 1
          client_id:
            type: string
            minLength: 1
        required:
        - bootstrap_servers
        - input_topic
        - output_topic
        - group_id
        additionalProperties: false
    required:
    - type
    oneOf:
    - properties:
        type:
          const: http
      required:
      - http
    - properties:
        type:
          const: kafka
      required:
      - kafka
    additionalProperties: false

required:
- phase
- extractors
- classifiers
- execution
- transport

additionalProperties: false
$schema: https://json-schema.org/draft/2020-12/schema
x-config-root-key: phase
